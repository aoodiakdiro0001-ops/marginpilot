function num(id,d){const v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?(d||0):v;}
function econ(o){
const r=o.ret/100,v=o.vat/100,g=o.gate/100,m=o.mkt/100,mg=o.marg/100;
const A=(1-r)*(1/(1+v)-g-m);
const B=(1-r)*(o.gateF+o.cogs+o.ship+o.pack+o.ads)+r*o.retC;
if(!(A>mg))return {ok:false,A,B};
const P=B/(A-mg);

const be=o.fix>0?(exp>0?Math.ceil(o.fix/exp):Infinity):0;
const roas=o.ads>0?P/o.ads:Infinity;
return {ok:true,A,B,P,exp,mg,be,roas};
}

else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
